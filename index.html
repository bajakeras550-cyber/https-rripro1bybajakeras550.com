<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RRI Pro 1 Mataram</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #24345c, #080b14 55%, #030409);
    color: white;
}

.radio {
    width: 92%;
    max-width: 480px;
    padding: 28px;
    border-radius: 28px;
    background: rgba(15, 20, 35, 0.92);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow:
        0 25px 70px rgba(0,0,0,0.65),
        inset 0 0 30px rgba(255,255,255,0.03);
    backdrop-filter: blur(15px);
}

.logo {
    text-align: center;
    font-size: 14px;
    letter-spacing: 4px;
    color: #9ba7c7;
    margin-bottom: 8px;
}

.station {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 5px;
}

.city {
    text-align: center;
    color: #9fa9c3;
    margin-bottom: 25px;
}

/* STATUS */

.status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-bottom: 25px;
    font-size: 14px;
}

.led {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #555;
    box-shadow: 0 0 0 transparent;
    transition: 0.3s;
}

.led.connected {
    background: #00ff73;
    box-shadow: 0 0 12px #00ff73;
}

.led.error {
    background: #ff3030;
    box-shadow: 0 0 12px #ff3030;
}

/* SPECTRUM */

.spectrum {
    height: 130px;
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 4px;
    padding: 15px;
    margin-bottom: 25px;
    border-radius: 18px;
    background: #05070d;
    overflow: hidden;
}

.bar {
    width: 7px;
    min-height: 2px;
    height: 2px;
    border-radius: 10px 10px 2px 2px;

    background: linear-gradient(
        to top,
        #00eaff,
        #00ff7b,
        #ffe600,
        #ff7a00,
        #ff1493
    );

    box-shadow: 0 0 8px rgba(0,255,255,0.5);

    transition: height 0.05s ease;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
    padding: 15px 24px;
    border-radius: 14px;
    background: linear-gradient(145deg, #293552, #151b2c);
    box-shadow:
        5px 5px 12px rgba(0,0,0,0.4),
        -3px -3px 8px rgba(255,255,255,0.04);
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.96);
}

.play {
    background: linear-gradient(135deg, #007cff, #8a2be2);
}

.stop {
    background: linear-gradient(135deg, #8d1c2c, #40101a);
}

/* VOLUME */

.volume-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.volume-box span {
    font-size: 20px;
}

input[type="range"] {
    flex: 1;
    accent-color: #00c8ff;
}

/* EQUALIZER */

.eq-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    color: #9ba7c7;
    margin-bottom: 15px;
}

.equalizer {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    height: 190px;
    padding: 12px 5px;
    border-radius: 18px;
    background: #05070d;
    border: 1px solid rgba(255,255,255,0.06);
}

.eq-band {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.eq-value {
    font-size: 10px;
    color: #9ba7c7;
    height: 18px;
}

.eq-slider {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 25px;
    height: 130px;
    accent-color: #00c8ff;
    cursor: pointer;
}

.eq-label {
    font-size: 9px;
    color: #aab2c8;
    margin-top: 8px;
    white-space: nowrap;
}

/* RESET */

.reset-eq {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    font-size: 12px;
    background: linear-gradient(145deg, #202941, #111725);
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 25px;
    color: #66708b;
    font-size: 12px;
}
</style></head><body><div class="radio"><div class="logo">
    RADIO STREAM
</div>

<div class="station">
    RRI PRO 1
</div>

<div class="city">
    Mataram
</div>

<div class="status">
    <div class="led" id="led"></div>
    <span id="statusText">Tidak terhubung</span>
</div>

<!-- SPEKTRUM AUDIO NYATA -->
<div class="spectrum" id="spectrum"></div>

<!-- AUDIO -->
<audio id="radioAudio" preload="none"></audio>

<!-- BUTTON -->
<div class="controls">

    <button class="play" onclick="playRadio()">
        ▶ PUTAR
    </button>

    <button class="stop" onclick="stopRadio()">
        ■ BERHENTI
    </button>

</div>

<!-- VOLUME -->
<div class="volume-box">

    <span>🔊</span>

    <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.8"
    >

</div>

<!-- EQUALIZER -->

<div class="eq-title">
    10 BAND EQUALIZER
</div>

<div class="equalizer" id="equalizer"></div>

<button
    class="reset-eq"
    onclick="resetEqualizer()">
    ↺ RESET EQ
</button>

<div class="footer">
    RRI Pro 1 Mataram • Live Radio
</div>

</div><script>

/* =====================================================
   RRI PRO 1 MATARAM
   ===================================================== */

const STREAM_URL =
"https://stream-node1.rri.co.id/streaming/13/9113/rrimatarampro1.mp3";


/* =====================================================
   AUDIO ELEMENT
   ===================================================== */

const audio =
document.getElementById("radioAudio");

audio.volume = 0.8;


/* =====================================================
   STATUS
   ===================================================== */

const led =
document.getElementById("led");

const statusText =
document.getElementById("statusText");


/* =====================================================
   WEB AUDIO
   ===================================================== */

let audioContext = null;

let sourceNode = null;

let analyser = null;

let masterGain = null;

let equalizer = [];

let audioGraphReady = false;


/* =====================================================
   10 BAND EQ
   ===================================================== */

const EQ_FREQUENCIES = [
    31,
    62,
    125,
    250,
    500,
    1000,
    2000,
    4000,
    8000,
    16000
];


/* =====================================================
   BUAT EQUALIZER
   ===================================================== */

function createEqualizerUI() {

    const container =
        document.getElementById("equalizer");

    EQ_FREQUENCIES.forEach(
        (frequency, index) => {

            const band =
                document.createElement("div");

            band.className =
                "eq-band";

            const value =
                document.createElement("div");

            value.className =
                "eq-value";

            value.id =
                "eq-value-" + index;

            value.textContent =
                "0 dB";


            const slider =
                document.createElement("input");

            slider.type =
                "range";

            slider.className =
                "eq-slider";

            slider.min =
                "-12";

            slider.max =
                "12";

            slider.step =
                "0.5";

            slider.value =
                "0";

            slider.id =
                "eq-" + index;


            const label =
                document.createElement("div");

            label.className =
                "eq-label";

            label.textContent =
                frequency >= 1000
                ? (frequency / 1000) + "k"
                : frequency + "";


            slider.addEventListener(
                "input",
                () => {

                    const gain =
                        Number(slider.value);

                    value.textContent =
                        (gain > 0 ? "+" : "") +
                        gain +
                        " dB";

                    if (equalizer[index]) {

                        equalizer[index]
                            .gain
                            .setTargetAtTime(
                                gain,
                                audioContext.currentTime,
                                0.01
                            );
                    }
                }
            );


            band.appendChild(value);

            band.appendChild(slider);

            band.appendChild(label);

            container.appendChild(band);
        }
    );
}

createEqualizerUI();


/* =====================================================
   MEMBUAT AUDIO GRAPH
   ===================================================== */

function setupAudioGraph() {

    if (audioGraphReady)
        return;


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        statusText.textContent =
            "Browser tidak mendukung Web Audio";

        led.className =
            "led error";

        return false;
    }


    audioContext =
        new AudioContext();


    /*
       RRI AUDIO
          ↓
       SOURCE
          ↓
       10 BAND EQ
          ↓
       ANALYSER
          ↓
       MASTER VOLUME
          ↓
       SPEAKER HP
    */


    sourceNode =
        audioContext
            .createMediaElementSource(audio);


    let previousNode =
        sourceNode;


    EQ_FREQUENCIES.forEach(
        (frequency) => {

            const filter =
                audioContext
                    .createBiquadFilter();

            filter.type =
                "peaking";

            filter.frequency.value =
                frequency;

            filter.Q.value =
                1.1;

            filter.gain.value =
                0;

            previousNode.connect(filter);

            previousNode =
                filter;

            equalizer.push(filter);
        }
    );


    /*
       ANALYSER
    */

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize =
        2048;

    analyser.minDecibels =
        -90;

    analyser.maxDecibels =
        -10;

    analyser.smoothingTimeConstant =
        0.72;


    /*
       MASTER VOLUME
    */

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        audio.volume;


    previousNode.connect(analyser);

    analyser.connect(masterGain);

    masterGain.connect(
        audioContext.destination
    );


    audioGraphReady =
        true;


    return true;
}


/* =====================================================
   PUTAR
   ===================================================== */

async function playRadio() {

    statusText.textContent =
        "Menghubungkan...";

    led.className =
        "led";


    try {

        /*
           Audio graph dibuat setelah
           pengguna menekan tombol.
        */

        if (!setupAudioGraph())
            return;


        /*
           Browser mobile biasanya
           membutuhkan resume() setelah
           interaksi pengguna.
        */

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();
        }


        /*
           Jangan mengganti src setiap kali
           tombol Play ditekan jika sudah ada.
        */

        if (!audio.src) {

            audio.src =
                STREAM_URL;

        }


        await audio.play();


        statusText.textContent =
            "Terhubung • LIVE";

        led.className =
            "led connected";


        startRealSpectrum();


    } catch (error) {

        console.error(
            "Audio error:",
            error
        );


        statusText.textContent =
            "Gagal memutar stream";

        led.className =
            "led error";

        stopSpectrum();
    }
}


/* =====================================================
   BERHENTI
   ===================================================== */

function stopRadio() {

    audio.pause();

    audio.removeAttribute("src");

    audio.load();


    statusText.textContent =
        "Tidak terhubung";

    led.className =
        "led";


    stopSpectrum();
}


/* =====================================================
   VOLUME
   ===================================================== */

document
.getElementById("volume")
.addEventListener(
    "input",
    function () {

        const value =
            Number(this.value);

        audio.volume =
            value;


        if (masterGain) {

            masterGain.gain.setTargetAtTime(
                value,
                audioContext.currentTime,
                0.01
            );
        }
    }
);


/* =====================================================
   REAL AUDIO SPECTRUM
   ===================================================== */

const spectrum =
document.getElementById("spectrum");

const BAR_COUNT =
    42;

const bars = [];


for (
    let i = 0;
    i < BAR_COUNT;
    i++
) {

    const bar =
        document.createElement("div");

    bar.className =
        "bar";

    spectrum.appendChild(bar);

    bars.push(bar);
}


let spectrumAnimation =
    null;


function startRealSpectrum() {

    if (!analyser)
        return;


    if (spectrumAnimation)
        return;


    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    function draw() {

        spectrumAnimation =
            requestAnimationFrame(draw);


        /*
           Ambil frekuensi AUDIO SEBENARNYA.
        */

        analyser.getByteFrequencyData(
            data
        );


        const binCount =
            data.length;


        for (
            let i = 0;
            i < BAR_COUNT;
            i++
        ) {

            /*
               Membagi spektrum
               menjadi 42 bagian.
            */

            const start =
                Math.floor(
                    Math.pow(
                        i / BAR_COUNT,
                        1.7
                    ) * binCount * 0.75
                );


            const end =
                Math.max(
                    start + 1,
                    Math.floor(
                        Math.pow(
                            (i + 1) / BAR_COUNT,
                            1.7
                        ) * binCount * 0.75
                    )
                );


            let sum = 0;

            let count = 0;


            for (
                let j = start;
                j < end && j < binCount;
                j++
            ) {

                sum += data[j];

                count++;
            }


            const average =
                count
                ? sum / count
                : 0;


            /*
               Noise kecil ditekan supaya
               ketika penyiar diam,
               spectrum benar-benar turun.
            */

            let level =
                Math.max(
                    0,
                    average - 12
                );


            let height =
                (level / 243) * 110;


            /*
               Sedikit penguatan visual,
               tetapi tetap berdasarkan
               audio sebenarnya.
            */

            height *= 1.18;


            if (height < 3)
                height = 2;


            if (height > 110)
                height = 110;


            bars[i].style.height =
                height + "px";
        }
    }


    draw();
}


/* =====================================================
   STOP SPECTRUM
   ===================================================== */

function stopSpectrum() {

    if (spectrumAnimation) {

        cancelAnimationFrame(
            spectrumAnimation
        );

        spectrumAnimation =
            null;
    }


    bars.forEach(
        bar => {

            bar.style.height =
                "2px";
        }
    );
}


/* =====================================================
   RESET EQUALIZER
   ===================================================== */

function resetEqualizer() {

    EQ_FREQUENCIES.forEach(
        (frequency, index) => {

            const slider =
                document.getElementById(
                    "eq-" + index
                );

            const value =
                document.getElementById(
                    "eq-value-" + index
                );


            slider.value =
                "0";

            value.textContent =
                "0 dB";


            if (equalizer[index]) {

                equalizer[index]
                    .gain
                    .setTargetAtTime(
                        0,
                        audioContext
                        ? audioContext.currentTime
                        : 0,
                        0.01
                    );
            }
        }
    );
}


/* =====================================================
   STREAM ERROR
   ===================================================== */

audio.addEventListener(
    "error",
    () => {

        statusText.textContent =
            "Koneksi terputus";

        led.className =
            "led error";

        stopSpectrum();
    }
);


/* =====================================================
   PLAYING
   ===================================================== */

audio.addEventListener(
    "playing",
    () => {

        statusText.textContent =
            "Terhubung • LIVE";

        led.className =
            "led connected";

        startRealSpectrum();
    }
);


/* =====================================================
   WAITING / BUFFERING
   ===================================================== */

audio.addEventListener(
    "waiting",
    () => {

        statusText.textContent =
            "Buffering...";
    }
);


/* =====================================================
   PAUSE
   ===================================================== */

audio.addEventListener(
    "pause",
    () => {

        if (!audio.src)
            return;

        statusText.textContent =
            "Dijeda";
    }
);

</script></body>
</html>

<script>

/* =====================================================
   RRI PRO 1 MATARAM
   ===================================================== */

const STREAM_URL =
"https://stream-node1.rri.co.id/streaming/13/9113/rrimatarampro1.mp3";


/* =====================================================
   AUDIO ELEMENT
   ===================================================== */

const audio =
document.getElementById("radioAudio");

audio.volume = 0.8;


/* =====================================================
   STATUS
   ===================================================== */

const led =
document.getElementById("led");

const statusText =
document.getElementById("statusText");


function setStatus(text, type = "") {

    statusText.textContent = text;

    led.className = "led";

    if (type) {
        led.classList.add(type);
    }
}


/* =====================================================
   WEB AUDIO
   ===================================================== */

let audioContext = null;

let sourceNode = null;

let analyser = null;

let masterGain = null;

let equalizer = [];

let audioGraphReady = false;


/* =====================================================
   10 BAND EQ
   ===================================================== */

const EQ_FREQUENCIES = [
    31,
    62,
    125,
    250,
    500,
    1000,
    2000,
    4000,
    8000,
    16000
];


/* =====================================================
   BUAT EQUALIZER
   ===================================================== */

function createEqualizerUI() {

    const container =
        document.getElementById("equalizer");

    EQ_FREQUENCIES.forEach(
        (frequency, index) => {

            const band =
                document.createElement("div");

            band.className =
                "eq-band";


            const value =
                document.createElement("div");

            value.className =
                "eq-value";

            value.id =
                "eq-value-" + index;

            value.textContent =
                "0 dB";


            const slider =
                document.createElement("input");

            slider.type =
                "range";

            slider.className =
                "eq-slider";

            slider.min =
                "-12";

            slider.max =
                "12";

            slider.step =
                "0.5";

            slider.value =
                "0";

            slider.id =
                "eq-" + index;


            const label =
                document.createElement("div");

            label.className =
                "eq-label";

            label.textContent =
                frequency >= 1000
                ? (frequency / 1000) + "k"
                : frequency + "";


            slider.addEventListener(
                "input",
                () => {

                    const gain =
                        Number(slider.value);

                    value.textContent =
                        (gain > 0 ? "+" : "") +
                        gain +
                        " dB";


                    if (
                        equalizer[index] &&
                        audioContext
                    ) {

                        equalizer[index]
                            .gain
                            .setTargetAtTime(
                                gain,
                                audioContext.currentTime,
                                0.01
                            );
                    }
                }
            );


            band.appendChild(value);

            band.appendChild(slider);

            band.appendChild(label);

            container.appendChild(band);
        }
    );
}

createEqualizerUI();


/* =====================================================
   MEMBUAT AUDIO GRAPH
   ===================================================== */

function setupAudioGraph() {

    if (audioGraphReady)
        return true;


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        setStatus(
            "Browser tidak mendukung audio",
            "error"
        );

        return false;
    }


    audioContext =
        new AudioContext();


    /*
       AUDIO
          ↓
       SOURCE
          ↓
       EQ
          ↓
       ANALYSER
          ↓
       MASTER
          ↓
       SPEAKER
    */


    sourceNode =
        audioContext
            .createMediaElementSource(audio);


    let previousNode =
        sourceNode;


    EQ_FREQUENCIES.forEach(
        (frequency) => {

            const filter =
                audioContext
                    .createBiquadFilter();

            filter.type =
                "peaking";

            filter.frequency.value =
                frequency;

            filter.Q.value =
                1.1;

            filter.gain.value =
                0;


            previousNode.connect(filter);

            previousNode =
                filter;

            equalizer.push(filter);
        }
    );


    analyser =
        audioContext.createAnalyser();

    analyser.fftSize =
        2048;

    analyser.minDecibels =
        -90;

    analyser.maxDecibels =
        -10;

    analyser.smoothingTimeConstant =
        0.72;


    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        audio.volume;


    previousNode.connect(analyser);

    analyser.connect(masterGain);

    masterGain.connect(
        audioContext.destination
    );


    audioGraphReady =
        true;


    return true;
}


/* =====================================================
   PUTAR RADIO
   ===================================================== */

let connectionTimeout = null;


async function playRadio() {

    clearTimeout(connectionTimeout);


    setStatus(
        "Menghubungkan...",
        ""
    );


    try {

        /*
           Buat Web Audio
           setelah tombol ditekan.
        */

        if (!setupAudioGraph()) {
            return;
        }


        /*
           Aktifkan AudioContext.
        */

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();
        }


        /*
           Pasang URL RRI
           hanya jika belum ada.
        */

        if (
            !audio.src ||
            audio.src !== STREAM_URL
        ) {

            audio.src =
                STREAM_URL;

            audio.load();
        }


        /*
           MULAI PLAY.
           
           Penting:
           kita TIDAK langsung mengatakan
           "Terhubung".
        */

        await audio.play();


        /*
           Beri waktu stream untuk
           benar-benar mulai.
        */

        connectionTimeout =
            setTimeout(
                () => {

                    if (
                        !audio.paused &&
                        !audio.ended &&
                        audio.readyState < 3
                    ) {

                        setStatus(
                            "RRI belum mengirim audio",
                            "error"
                        );

                        stopSpectrum();
                    }

                },
                15000
            );


    } catch (error) {

        console.error(
            "RRI PLAY ERROR:",
            error
        );


        clearTimeout(
            connectionTimeout
        );


        setStatus(
            "Gagal terhubung ke RRI",
            "error"
        );


        stopSpectrum();
    }
}


/* =====================================================
   EVENT: AUDIO BENAR-BENAR MULAI
   ===================================================== */

audio.addEventListener(
    "playing",
    () => {

        clearTimeout(
            connectionTimeout
        );


        setStatus(
            "Terhubung • LIVE",
            "connected"
        );


        startRealSpectrum();
    }
);


/* =====================================================
   EVENT: BUFFERING
   ===================================================== */

audio.addEventListener(
    "waiting",
    () => {

        setStatus(
            "Buffering...",
            ""
        );
    }
);


/* =====================================================
   EVENT: CAN PLAY
   ===================================================== */

audio.addEventListener(
    "canplay",
    () => {

        /*
           Jangan langsung dianggap LIVE.
           Tunggu event "playing".
        */

        if (
            !audio.paused &&
            audio.readyState >= 3
        ) {

            setStatus(
                "Menyiapkan audio...",
                ""
            );
        }
    }
);


/* =====================================================
   EVENT: ERROR
   ===================================================== */

audio.addEventListener(
    "error",
    () => {

        clearTimeout(
            connectionTimeout
        );


        console.error(
            "RRI AUDIO ERROR:",
            audio.error
        );


        setStatus(
            "Gagal terhubung ke RRI",
            "error"
        );


        stopSpectrum();
    }
);


/* =====================================================
   EVENT: STALLED
   ===================================================== */

audio.addEventListener(
    "stalled",
    () => {

        setStatus(
            "Koneksi RRI terhenti...",
            ""
        );
    }
);


/* =====================================================
   EVENT: SUSPEND
   ===================================================== */

audio.addEventListener(
    "suspend",
    () => {

        /*
           Tidak dianggap error.
           Browser kadang memanggil suspend
           pada stream.
        */

        console.log(
            "RRI stream suspended"
        );
    }
);


/* =====================================================
   BERHENTI
   ===================================================== */

function stopRadio() {

    clearTimeout(
        connectionTimeout
    );


    audio.pause();


    /*
       Tidak perlu menghapus src.
       Dengan begitu kita tidak perlu
       membuat ulang koneksi setiap kali.
    */

    setStatus(
        "Tidak terhubung",
        ""
    );


    stopSpectrum();
}


/* =====================================================
   VOLUME
   ===================================================== */

document
.getElementById("volume")
.addEventListener(
    "input",
    function () {

        const value =
            Number(this.value);


        audio.volume =
            value;


        if (
            masterGain &&
            audioContext
        ) {

            masterGain.gain.setTargetAtTime(
                value,
                audioContext.currentTime,
                0.01
            );
        }
    }
);


/* =====================================================
   REAL AUDIO SPECTRUM
   ===================================================== */

const spectrum =
document.getElementById("spectrum");

const BAR_COUNT =
    42;

const bars = [];


for (
    let i = 0;
    i < BAR_COUNT;
    i++
) {

    const bar =
        document.createElement("div");

    bar.className =
        "bar";

    spectrum.appendChild(bar);

    bars.push(bar);
}


let spectrumAnimation =
    null;


function startRealSpectrum() {

    if (!analyser)
        return;


    if (spectrumAnimation)
        return;


    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    function draw() {

        spectrumAnimation =
            requestAnimationFrame(draw);


        analyser.getByteFrequencyData(
            data
        );


        const binCount =
            data.length;


        for (
            let i = 0;
            i < BAR_COUNT;
            i++
        ) {

            const start =
                Math.floor(
                    Math.pow(
                        i / BAR_COUNT,
                        1.7
                    ) *
                    binCount *
                    0.75
                );


            const end =
                Math.max(
                    start + 1,
                    Math.floor(
                        Math.pow(
                            (i + 1) /
                            BAR_COUNT,
                            1.7
                        ) *
                        binCount *
                        0.75
                    )
                );


            let sum = 0;

            let count = 0;


            for (
                let j = start;
                j < end &&
                j < binCount;
                j++
            ) {

                sum += data[j];

                count++;
            }


            const average =
                count
                ? sum / count
                : 0;


            let level =
                Math.max(
                    0,
                    average - 12
                );


            let height =
                (level / 243) * 110;


            height *= 1.18;


            if (height < 3)
                height = 2;


            if (height > 110)
                height = 110;


            bars[i].style.height =
                height + "px";
        }
    }


    draw();
}


/* =====================================================
   STOP SPECTRUM
   ===================================================== */

function stopSpectrum() {

    if (spectrumAnimation) {

        cancelAnimationFrame(
            spectrumAnimation
        );

        spectrumAnimation =
            null;
    }


    bars.forEach(
        bar => {

            bar.style.height =
                "2px";
        }
    );
}


/* =====================================================
   RESET EQ
   ===================================================== */

function resetEqualizer() {

    EQ_FREQUENCIES.forEach(
        (frequency, index) => {

            const slider =
                document.getElementById(
                    "eq-" + index
                );


            const value =
                document.getElementById(
                    "eq-value-" + index
                );


            slider.value =
                "0";


            value.textContent =
                "0 dB";


            if (
                equalizer[index] &&
                audioContext
            ) {

                equalizer[index]
                    .gain
                    .setTargetAtTime(
                        0,
                        audioContext.currentTime,
                        0.01
                    );
            }
        }
    );
}


/* =====================================================
   PAUSE
   ===================================================== */

audio.addEventListener(
    "pause",
    () => {

        if (!audio.src)
            return;


        /*
           Jangan ubah status menjadi
           "Dijeda" ketika browser hanya
           sedang menangani buffering.
        */

        if (
            audio.readyState === 0
        ) {

            return;
        }


        setStatus(
            "Dijeda",
            ""
        );
    }
);

    </script>
